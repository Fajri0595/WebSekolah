<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3CF68"/>
      <stop offset="50%" stop-color="#D49B27"/>
      <stop offset="100%" stop-color="#9E6E10"/>
    </linearGradient>
    <radialGradient id="navyField" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#214985"/>
      <stop offset="70%" stop-color="#132C54"/>
      <stop offset="100%" stop-color="#0A1931"/>
    </radialGradient>
    <linearGradient id="flameGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="45%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Perisai Segilima Khas Sekolah Umum Indonesia (Outer Gold Crest) -->
  <path d="M256 18 C326 18 438 68 474 134 C498 178 492 310 434 394 C384 466 302 492 256 498 C210 492 128 466 78 394 C20 310 14 178 38 134 C74 68 186 18 256 18 Z" fill="url(#goldRim)"/>

